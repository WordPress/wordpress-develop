services:

  ##
  # The web server container.
  ##
  wordpress-develop:
    image: httpd:alpine
    networks:
      - wpdevnet
    ports:
      - ${LOCAL_PORT-8889}:80
    environment:
      LOCAL_DIR: ${LOCAL_DIR-src}
    volumes:
      - ./tools/local-env/apache-vhost.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf
      - ./:/var/www
    command: >
      /bin/sh -c "
        sed -e '/Include conf\\/extra\\/httpd-vhosts.conf/s/^#//' /usr/local/apache2/conf/httpd.conf > /tmp/httpd.conf &&
        cat /tmp/httpd.conf > /usr/local/apache2/conf/httpd.conf &&
        rm /tmp/httpd.conf &&
        echo 'LoadModule rewrite_module modules/mod_rewrite.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule proxy_module modules/mod_proxy.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule proxy_http_module modules/mod_proxy_http.so' >> /usr/local/apache2/conf/httpd.conf &&
        sed -e 's/\$$LOCAL_DIR/$${LOCAL_DIR}/g' /usr/local/apache2/conf/extra/httpd-vhosts.conf > /tmp/httpd-vhosts.conf &&
        cat /tmp/httpd-vhosts.conf > /usr/local/apache2/conf/extra/httpd-vhosts.conf &&
        rm /tmp/httpd-vhosts.conf &&
        exec httpd-foreground
      "
    depends_on:
      php:
        condition: service_started
      mysql:
        condition: service_healthy

  ##
  # The PHP container.
  ##
  php:
    image: wordpressdevelop/php:${LOCAL_PHP-latest}

    networks:
      - wpdevnet

    environment:
      LOCAL_PHP_XDEBUG: ${LOCAL_PHP_XDEBUG-false}
      XDEBUG_MODE: ${LOCAL_PHP_XDEBUG_MODE-develop,debug}
      LOCAL_PHP_MEMCACHED: ${LOCAL_PHP_MEMCACHED-false}
      PHP_FPM_UID: ${PHP_FPM_UID-1000}
      PHP_FPM_GID: ${PHP_FPM_GID-1000}
      GITHUB_REF: ${GITHUB_REF-false}
      GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME-false}
      HOST_PATH: ${PWD-}/${LOCAL_DIR-src}

    volumes:
      - ./tools/local-env/php-config.ini:/usr/local/etc/php/conf.d/php-config.ini
      - ./:/var/www

    # Copy or delete the Memcached dropin plugin file as appropriate.
    command: /bin/sh -c "if [ $LOCAL_PHP_MEMCACHED = true ]; then cp -n /var/www/tests/phpunit/includes/object-cache.php /var/www/src/wp-content/object-cache.php; else rm -f /var/www/src/wp-content/object-cache.php; fi && exec php-fpm"

    # The init directive ensures the command runs with a PID > 1, so Ctrl+C works correctly.
    init: true

    extra_hosts:
      - localhost:host-gateway

  ##
  # The MySQL container.
  ##
  mysql:
    image: ${LOCAL_DB_TYPE-mysql}:${LOCAL_DB_VERSION-latest}

    networks:
      - wpdevnet

    ports:
      - "${LOCAL_DB_PORTS-3306}"

    environment:
      MYSQL_ROOT_PASSWORD: password

    volumes:
      - ./tools/local-env/mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql
      - mysql:/var/lib/mysql

    healthcheck:
      test: [
        'CMD-SHELL',
        'if [ "$LOCAL_DB_TYPE" = "mariadb" ]; then case "$LOCAL_DB_VERSION" in 5.5|10.0|10.1|10.2|10.3) mysqladmin ping -h localhost || exit $$?;; *) mariadb-admin ping -h localhost || exit $$?;; esac; else mysqladmin ping -h localhost || exit $$?; fi'
      ]
      timeout: 5s
      interval: 5s
      retries: 10

  ##
  # The WP CLI container.
  ##
  cli:
    image: wordpressdevelop/cli:${LOCAL_PHP-latest}

    networks:
      - wpdevnet

    environment:
      LOCAL_PHP_XDEBUG: ${LOCAL_PHP_XDEBUG-false}
      LOCAL_PHP_MEMCACHED: ${LOCAL_PHP_MEMCACHED-false}
      PHP_FPM_UID: ${PHP_FPM_UID-1000}
      PHP_FPM_GID: ${PHP_FPM_GID-1000}
      HOST_PATH: ${PWD-}/${LOCAL_DIR-src}
      WP_CONFIG_PATH: /var/www/wp-config.php

    volumes:
      - ./:/var/www

    # Keeps the service alive.
    command: 'sleep infinity'

    # The init directive ensures the command runs with a PID > 1, so Ctrl+C works correctly.
    init: true

    extra_hosts:
      - localhost:host-gateway

    depends_on:
      php:
        condition: service_started
      mysql:
        condition: service_healthy

  ##
  # The Memcached container.
  ##
  memcached:
    image: memcached

    networks:
      - wpdevnet

    ports:
      - 11211:11211

    depends_on:
      php:
        condition: service_started

volumes:
  # So that sites aren't wiped every time containers are restarted, MySQL uses a persistent volume.
  mysql: {}

networks:
  # Creating our own network allows us to connect between containers using their service name.
  wpdevnet:
    driver: bridge
