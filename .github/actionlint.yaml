# actionlint does not recognize the `ubuntu-26.04` GitHub-hosted runner label yet.
# This can be removed once the pinned actionlint version includes it in its list of known labels.
self-hosted-runner:
  labels:
    - ubuntu-26.04

# actionlint does not support the `$/` self-repository `uses:` syntax yet.
# See https://github.com/rhysd/actionlint/issues/711.
paths:
  .github/workflows/**/*.yml:
    ignore:
      - 'specifying action "\$/[^"]+" in invalid format because ref is missing'
