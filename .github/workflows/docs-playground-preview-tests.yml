name: Code Reference Playground Preview Tests

on:
    # The preview tooling is self-contained: nothing outside these paths is
    # imported by the scripts or their tests, so nothing else can break them.
    # Pushes are filtered as well as pull requests, because the install needed
    # to type check pulls the whole tool tree for a suite of this size.
    #
    # The Code Reference Playground preview tooling was introduced in WordPress 7.2.
    push:
        branches:
            - trunk
            - '[7-9].[0-9]'
        paths:
            # This directory contains the preview implementation and its test suite.
            - '.github/scripts/docs-playground-preview/**'
            # This directory pins npm, the tool versions, and TypeScript. Changes could affect the outcome.
            - '.github/docs-playground-preview/**'
            # Confirm any changes to relevant workflow files.
            - '.github/workflows/docs-playground-preview-tests.yml'
    pull_request:
        branches:
            - trunk
            - '[7-9].[0-9]'
        paths:
            # This directory contains the preview implementation and its test suite.
            - '.github/scripts/docs-playground-preview/**'
            # This directory pins npm, the tool versions, and TypeScript. Changes could affect the outcome.
            - '.github/docs-playground-preview/**'
            # Confirm any changes to relevant workflow files.
            - '.github/workflows/docs-playground-preview-tests.yml'
    workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    # Runs the Code Reference Playground preview script tests and type checking.
    #
    # Performs the following steps:
    # - Checks out the repository.
    # - Sets up Node.js.
    # - Logs debug information about the GitHub Action runner.
    # - Installs npm dependencies.
    # - Runs the preview script tests.
    # - Runs type checking for the preview scripts.
    test:
        name: Test the Code Reference preview tooling
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        timeout-minutes: 10
        if: |
            github.repository == 'WordPress/wordpress-develop' || (
              github.event_name == 'pull_request' && (
                ! github.event.repository.private ||
                ! github.event.pull_request.draft ||
                contains( github.event.pull_request.labels.*.name, 'Draft Workflow Runs' )
              )
            )

        defaults:
            run:
                working-directory: .github/docs-playground-preview

        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: '.github/docs-playground-preview/.nvmrc'
                  cache: npm
                  cache-dependency-path: '.github/docs-playground-preview/package-lock.json'

            - name: Log debug information
              run: |
                  npm --version
                  node --version

            # The tests import nothing from `node_modules`, and type checking needs only the
            # pinned TypeScript compiler plus the Node type definitions resolved from the
            # dependency tree, so no install script output is used by either command.
            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Run the preview script tests
              run: npm test

            # Runs even when the tests fail so that a single run reports both problems.
            - name: Run type checking for the preview scripts
              if: ${{ ! cancelled() }}
              run: npm run typecheck
