# Fortk copy of WordPress/wordpress-develop .github/workflows/test-build-processes.yml
# BENIGN PoC: heavy jobs disabled (fast, guaranteed success), minimal job uploads
# the `pr-number` artifact whose content the real repo's `Pull Request Comments`
# workflow (workflow_run -> playground-details) trusts as the comment target.
#
# This file is the FORK version: it only takes effect for your own fork PR; it is
# never merged upstream. On the real repo everything stays untouched.
#
# Trigger surface is identical to upstream (pull_request, non-target) so the
# consumer's `if:` guards (repository / event / conclusion) all pass.
name: Test Build Processes

on:
  pull_request:
    branches:
      - trunk
      - '3.[7-9]'
      - '[4-9].[0-9]'
    paths:
      - '**'

# Fast, quiet run: no matrix builds, no Slack, no dispatch.
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ---- upstream heavy jobs, disabled in the fork copy ---------------------
  test-core-build-process:
    runs-on: ubuntu-24.04
    if: false
    steps:
      - run: 'true'

  test-core-build-process-additional-os:
    runs-on: ubuntu-24.04
    if: false
    steps:
      - run: 'true'

  slack-notifications:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'

  failed-workflow:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'

  # ---- PoC: the artifact the real consumer trusts -------------------------
  upload-pr-number:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fork (needed for the NR file committed in repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare pr-number artifact dir
        # Default: use THIS run's own PR number (fully benign â€” the bot will
        # comment only on your own PR). To demonstrate arbitrary targeting on a
        # PR you own, commit a `pr-number/NR` file with that number instead and
        # it will be used verbatim.
        run: |
          set -euo pipefail
          mkdir -p ./pr-number
          if [ -f ./pr-number/NR ]; then
            echo "Using committed NR file: $(cat ./pr-number/NR)"
          else
            echo "${{ github.event.number }}" > ./pr-number/NR
            echo "Using this run's PR number: $(cat ./pr-number/NR)"
          fi

      - name: Upload PR number artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: pr-number/
          if-no-files-found: error