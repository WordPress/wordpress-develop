name: File Type Check

# This check was introduced in 7.2. The branches below are the supported ones
# it can be backported to.

on:
  push:
    branches:
      - trunk
      - '6.[8-9]'
      - '[7-9].[0-9]'
    paths:
      # Inward check: files added to CSS/JS directories.
      - 'src/wp-includes/css/**'
      - 'src/wp-includes/js/**'
      - 'src/wp-admin/css/**'
      - 'src/wp-admin/js/**'
      # Outward check: CSS/JS files placed outside designated directories.
      - 'src/wp-includes/**.css'
      - 'src/wp-includes/**.js'
      - 'src/wp-admin/**.css'
      - 'src/wp-admin/**.js'
      # Confirm any changes to the workflow file itself.
      - '.github/workflows/file-type-check.yml'
  pull_request:
    branches:
      - trunk
      - '6.[8-9]'
      - '[7-9].[0-9]'
    paths:
      - 'src/wp-includes/css/**'
      - 'src/wp-includes/js/**'
      - 'src/wp-admin/css/**'
      - 'src/wp-admin/js/**'
      - 'src/wp-includes/**.css'
      - 'src/wp-includes/**.js'
      - 'src/wp-admin/**.css'
      - 'src/wp-admin/**.js'
      - '.github/workflows/file-type-check.yml'
  workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Verifies that CSS and JS files live in the directories intended for them.
  #
  # The checks read the list of tracked files from Git rather than walking the
  # working directory. Most build output is gitignored, so it is excluded by
  # construction and needs no allow-list. The exception is src/wp-includes/build/,
  # which is tracked, and is excluded explicitly below.
  #
  # The JS sources in src/js/ are out of scope. The build system decides where
  # those are placed, so only its output is checked.
  check-file-types:
    name: Verify file types in CSS/JS directories
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: |
      github.repository == 'WordPress/wordpress-develop' || (
        github.event_name == 'pull_request' && (
          ! github.event.repository.private ||
          ! github.event.pull_request.draft ||
          contains( github.event.pull_request.labels.*.name, 'Draft Workflow Runs' )
        )
      )
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Check for misplaced CSS and JS files
        run: |
          # Read the file list in one bare assignment so that `set -e` sees a
          # failure from Git. The `|| true` guards below, which keep a grep
          # that matches nothing from ending the step, would otherwise mask it.
          #
          # `core.quotePath` is disabled because it C-escapes and quotes any
          # path holding non-ASCII characters, which breaks the patterns below.
          tracked=$( git -c core.quotePath=false ls-files -- src/wp-includes src/wp-admin )

          # Git exits 0 when a pathspec matches nothing, so an empty list means
          # the directories moved, not that every file is in the right place.
          if [ -z "$tracked" ]; then
            echo "::error::No tracked files found under src/wp-includes or src/wp-admin."
            exit 1
          fi

          # The CSS directories hold only CSS, apart from the SCSS sources for
          # the admin colour schemes.
          inward_css=$( printf '%s\n' "$tracked" \
            | grep -E '^src/(wp-includes|wp-admin)/css/' \
            | grep -vE '\.css$' \
            | grep -vE '^src/wp-admin/css/colors/.+\.scss$' || true )

          # The JS directories hold only JS. Both are gitignored in full and
          # hold nothing but build output, so this only catches a file
          # committed with `git add -f`.
          inward_js=$( printf '%s\n' "$tracked" \
            | grep -E '^src/(wp-includes|wp-admin)/js/' \
            | grep -vE '\.js$' || true )

          # No CSS or JS outside those directories, apart from the generated
          # routes and pages build system in src/wp-includes/build/.
          outward=$( printf '%s\n' "$tracked" \
            | grep -E '\.(css|js)$' \
            | grep -vE '^src/(wp-includes|wp-admin)/(css|js)/' \
            | grep -v '^src/wp-includes/build/' || true )

          violations=$( printf '%s\n%s\n%s' "$inward_css" "$inward_js" "$outward" | grep -v '^$' || true )

          if [ -n "$violations" ]; then
            echo "::error::Misplaced files found."
            echo
            echo "$violations"
            echo
            echo "CSS directories should contain only .css files and JS directories only .js files."
            echo ".css and .js files belong in those directories, not elsewhere in wp-includes/ or wp-admin/."
            echo "If a file is a legitimate exception, update .github/workflows/file-type-check.yml."
            exit 1
          fi

          echo "All tracked CSS and JS files are correctly placed."

  slack-notifications:
    name: Slack Notifications
    uses: ./.github/workflows/slack-notifications.yml
    permissions:
      actions: read
      contents: read
    needs: [ check-file-types ]
    if: ${{ github.repository == 'WordPress/wordpress-develop' && github.event_name != 'pull_request' && always() }}
    with:
      calling_status: ${{ contains( needs.*.result, 'cancelled' ) && 'cancelled' || contains( needs.*.result, 'failure' ) && 'failure' || 'success' }}
    secrets:
      SLACK_GHA_SUCCESS_WEBHOOK: ${{ secrets.SLACK_GHA_SUCCESS_WEBHOOK }}
      SLACK_GHA_CANCELLED_WEBHOOK: ${{ secrets.SLACK_GHA_CANCELLED_WEBHOOK }}
      SLACK_GHA_FIXED_WEBHOOK: ${{ secrets.SLACK_GHA_FIXED_WEBHOOK }}
      SLACK_GHA_FAILURE_WEBHOOK: ${{ secrets.SLACK_GHA_FAILURE_WEBHOOK }}
