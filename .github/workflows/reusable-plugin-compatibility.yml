##
# A reusable workflow that installs a version of WordPress and then checks that a list of plugins can be
# activated against it without fataling.
#
# Each plugin in the `plugin-slugs` shard is tested on its own: it is installed, activated, exercised, and then
# removed before the next one is installed. This keeps one broken plugin from masking (or breaking) the next.
#
# The exception is a plugin that declares a `Requires Plugins` dependency, which core will not activate until
# that dependency is installed and active. Those dependencies are installed and activated alongside it, and the
# site is checked with only the dependencies active first so that a dependency's own breakage is not reported
# against the plugin under test.
##
name: Plugin Compatibility Tests

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to run tests on.'
        required: false
        type: 'string'
        default: 'ubuntu-24.04'
      wp-version:
        description: 'The version of WordPress to test against. Accepts a version number, "latest", or "nightly".'
        required: false
        type: 'string'
        default: 'nightly'
      php-version:
        description: 'The version of PHP to use. Expected format: X.Y.'
        required: false
        type: 'string'
        default: '8.3'
      plugin-slugs:
        description: 'A JSON array of WordPress.org plugin slugs to test in this shard.'
        required: true
        type: 'string'
      db-type:
        description: 'Database type. Valid types are mysql and mariadb.'
        required: false
        type: 'string'
        default: 'mysql'
      db-version:
        description: 'Database version.'
        required: false
        type: 'string'
        default: '8.4'

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Tests that each plugin in the shard can be activated against the given version of WordPress.
  #
  # Performs the following steps:
  # - Sets up PHP.
  # - Downloads the specified version of WordPress.
  # - Creates a `wp-config.php` file with debugging and error logging enabled.
  # - Installs WordPress.
  # - Starts the PHP built-in web server so HTTP requests can be made against the site.
  # - Installs, activates, exercises, and removes each plugin in the shard, one at a time, together with
  #   anything it declares in `Requires Plugins`.
  # - Writes a results table to the workflow summary and fails the job if any plugin fataled.
  plugin-compatibility-tests:
    name: PHP ${{ inputs.php-version }} with ${{ 'mariadb' == inputs.db-type && 'MariaDB' || 'MySQL' }} ${{ inputs.db-version }}
    permissions:
      contents: read
    runs-on: ${{ inputs.os }}
    # Installing a plugin's dependencies before testing it adds a download and an activation for each
    # one, and a dependency the size of WooCommerce is not quick to activate.
    timeout-minutes: 45

    services:
      database:
        # The database type and version are inputs so that this workflow can be pointed at any supported
        # combination, which means the image cannot be pinned to a digest. This matches how the database
        # service is declared in install-testing.yml and reusable-upgrade-testing.yml.
        image: ${{ inputs.db-type }}:${{ inputs.db-version }} # zizmor: ignore[unpinned-images]
        ports:
          - 3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval="30s"
          --health-timeout="10s"
          --health-retries="5"
          -e MYSQL_ROOT_PASSWORD="root"
          -e MYSQL_DATABASE="test_db"

    steps:
      - name: Set up PHP ${{ inputs.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '${{ inputs.php-version }}'
          coverage: none
          tools: wp-cli

      - name: Download WordPress ${{ inputs.wp-version }}
        run: wp core download --version="${WP_VERSION}"
        env:
          WP_VERSION: ${{ inputs.wp-version }}

      - name: Create wp-config.php file
        run: wp config create --dbname=test_db --dbuser=root --dbpass=root --dbhost="127.0.0.1:${DB_PORT}"
        env:
          DB_PORT: ${{ job.services.database.ports['3306'] }}

      # Errors need to reach `wp-content/debug.log` so that a white screen of death is still detectable.
      #
      # `WP_DEBUG_DISPLAY` is left off on purpose: this should behave the way a production site does, where a
      # fatal error is an empty page and an HTTP 500 rather than a printed stack trace.
      #
      # The fatal error handler is disabled so that a fatal is reported as a fatal instead of being swallowed by
      # recovery mode, which would also deactivate the plugin mid-test.
      #
      # WP-Cron is disabled because WordPress spawns it as a loopback request during a front end request. The
      # loopback lands back on the same PHP built-in server that is still busy serving the request that spawned
      # it, and the two deadlock until curl gives up. Catching fatals that only happen on a scheduled event is
      # worth doing, but it needs to run through WP-CLI rather than a loopback, which is follow up work.
      - name: Enable debugging and error logging
        run: |
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_LOG true --raw
          wp config set WP_DEBUG_DISPLAY false --raw
          wp config set WP_DISABLE_FATAL_ERROR_HANDLER true --raw
          wp config set DISABLE_WP_CRON true --raw

      - name: Install WordPress
        run: |
          wp core install --url="${SITE_URL}" --title="Plugin Compatibility Test" --admin_user=admin \
          --admin_password=password --admin_email=me@example.org --skip-email
        env:
          SITE_URL: http://127.0.0.1:8889

      # The site needs to answer real requests so that fatals which only happen on a front end or admin page
      # load are caught. The built-in server is enough for that and needs nothing installed.
      #
      # `PHP_CLI_SERVER_WORKERS` is set because the built-in server is single threaded by default. Plenty of
      # plugins make a loopback request to the site they are running on, and a single threaded server cannot
      # answer one while it is still serving the request that made it.
      - name: Start the PHP built-in web server
        env:
          PHP_CLI_SERVER_WORKERS: '4'
        run: |
          set -uo pipefail

          nohup php -S 127.0.0.1:8889 -t "$( pwd )" > "${RUNNER_TEMP}/php-server.log" 2>&1 &

          # Wait for the server to start answering before any plugin is installed.
          for _ in $( seq 1 30 ); do
            if curl -sSf -o /dev/null "http://127.0.0.1:8889/wp-login.php"; then
              printf 'The PHP built-in server is ready.\n'
              exit 0
            fi
            sleep 1
          done

          printf 'The PHP built-in server did not start.\n'
          cat "${RUNNER_TEMP}/php-server.log"
          exit 1

      - name: Test each plugin in isolation
        env:
          PLUGIN_SLUGS: ${{ inputs.plugin-slugs }}
          PHP_VERSION: ${{ inputs.php-version }}
          SITE_URL: http://127.0.0.1:8889
          WP_VERSION: ${{ inputs.wp-version }}
        run: |
          # `set -e` is deliberately not used here: a plugin that fatals must not stop the remaining
          # plugins in the shard from being tested.
          set -uo pipefail

          RESULTS="${RUNNER_TEMP}/plugin-results.tsv"
          RESPONSE_BODY="${RUNNER_TEMP}/response.html"
          : > "${RESULTS}"

          # How many levels of `Requires Plugins` to follow. Chains in the directory are one level
          # deep in practice, so the bound is only here to stop a circular declaration from looping
          # forever.
          MAX_DEPENDENCY_DEPTH=3

          # Everything installed for the plugin currently under test, that plugin included. The
          # directories are tracked alongside the slugs because a plugin does not always unpack into
          # a directory named after its slug.
          INSTALLED_SLUGS=()
          INSTALLED_DIRS=()

          # record <slug> <version> <status> <dependencies> <reason>
          #
          # Appends one tab separated row to the results file. The reason is flattened so that it cannot
          # break the markdown table that is generated from these rows later on.
          record() {
            SAFE_REASON="$( printf '%s' "${5:--}" | tr '\n\t|' '   ' )"
            printf '%s\t%s\t%s\t%s\t%s\n' "${1}" "${2:-unknown}" "${3}" "${4:--}" "${SAFE_REASON}" >> "${RESULTS}"
          }

          # check_url <path>
          #
          # Requests a path on the test site and prints a reason to stdout when the response looks broken.
          # Prints nothing when the request looks healthy.
          check_url() {
            CURL_EXIT_CODE=0
            # The exit code is captured separately rather than falling back to a literal inside the command
            # substitution, which would append to whatever curl had already written and produce a nonsense
            # status like "200000" when a request returned headers and then stalled.
            HTTP_CODE="$( curl -s -o "${RESPONSE_BODY}" -w '%{http_code}' --max-time 60 "${SITE_URL}${1}" )" || CURL_EXIT_CODE=$?

            if [ -z "${HTTP_CODE}" ] || [ "${HTTP_CODE}" = "000" ]; then
              printf 'The request to %s did not complete, curl exit code %s' "${1}" "${CURL_EXIT_CODE}"
              return
            fi

            if [ "${HTTP_CODE}" -ge 500 ]; then
              printf 'The request to %s returned HTTP %s' "${1}" "${HTTP_CODE}"
              return
            fi

            if [ "${CURL_EXIT_CODE}" -ne 0 ]; then
              printf 'The request to %s returned HTTP %s but the response did not finish, curl exit code %s' "${1}" "${HTTP_CODE}" "${CURL_EXIT_CODE}"
              return
            fi

            # Belt and braces. Errors are not displayed by default, but a plugin can turn display_errors
            # back on for itself.
            if grep -qi 'Fatal error' "${RESPONSE_BODY}"; then
              printf 'The response from %s contained a fatal error' "${1}"
            fi
          }

          # The plugins directory itself must never be removed, only directories inside it.
          PLUGINS_ROOT="$( wp plugin path )"

          # install_plugin <slug>
          #
          # Installs a plugin from WordPress.org and remembers it so that it is removed again once the
          # plugin under test has been checked. The slug is remembered before the download is attempted
          # so that a partial download is still cleaned up. Returns non zero when the download failed.
          install_plugin() {
            INSTALLED_SLUGS+=( "${1}" )
            INSTALLED_DIRS+=( "" )

            wp plugin install "${1}" --skip-plugins --skip-themes || return 1

            INSTALLED_DIRS[-1]="$( wp plugin path "${1}" --dir --skip-plugins --skip-themes 2>/dev/null || printf '' )"
          }

          # plugin_dependencies <slug>
          #
          # Prints the slugs named in the plugin's `Requires Plugins` header, one per line. WordPress'
          # own header parser is used so that the same rules apply here as when core decides whether a
          # plugin's dependencies are met.
          plugin_dependencies() {
            PLUGIN_FILE="$( wp plugin path "${1}" --skip-plugins --skip-themes 2>/dev/null || printf '' )"

            [ -n "${PLUGIN_FILE}" ] || return 0

            # The single quotes are what keep the shell out of the PHP below. The path is handed over as an
            # environment variable rather than interpolated so that it never reaches PHP as source code.
            # shellcheck disable=SC2016
            PLUGIN_FILE="${PLUGIN_FILE}" wp eval --skip-plugins --skip-themes '
              require_once ABSPATH . "wp-admin/includes/plugin.php";

              $plugin_data = get_plugin_data( getenv( "PLUGIN_FILE" ), false, false );

              foreach ( explode( ",", $plugin_data["RequiresPlugins"] ?? "" ) as $dependency ) {
                // Core only accepts a WordPress.org slug here, so anything else is ignored.
                if ( preg_match( "/^[a-z0-9-]+$/", trim( $dependency ) ) ) {
                  echo trim( $dependency ), "\n";
                }
              }
            ' 2>/dev/null
          }

          # cleanup_plugins
          #
          # Returns the site to a clean slate by removing everything installed for the current plugin,
          # its dependencies included. A plugin that fatals can take WP-CLI down with it, so every
          # command here is allowed to fail and the plugin directory is removed directly as a fallback.
          # `--skip-plugins` keeps WP-CLI from loading the broken plugin while cleaning up after it.
          cleanup_plugins() {
            for INDEX in "${!INSTALLED_SLUGS[@]}"; do
              CLEANUP_SLUG="${INSTALLED_SLUGS[${INDEX}]}"
              CLEANUP_DIR="${INSTALLED_DIRS[${INDEX}]}"

              wp plugin deactivate "${CLEANUP_SLUG}" --skip-plugins --skip-themes > /dev/null 2>&1 || true
              wp plugin delete "${CLEANUP_SLUG}" --skip-plugins --skip-themes > /dev/null 2>&1 || true

              if [ -n "${CLEANUP_DIR}" ] && [ -d "${CLEANUP_DIR}" ] && [ "${CLEANUP_DIR}" != "${PLUGINS_ROOT}" ]; then
                rm -rf "${CLEANUP_DIR}"
              fi

              rm -rf "wp-content/plugins/${CLEANUP_SLUG}"
            done

            INSTALLED_SLUGS=()
            INSTALLED_DIRS=()

            # Make sure nothing is left behind in `active_plugins` pointing at a plugin that is now gone.
            wp option update active_plugins '[]' --format=json --skip-plugins --skip-themes > /dev/null 2>&1 || true
          }

          while IFS= read -r SLUG; do
            [ -n "${SLUG}" ] || continue

            printf '::group::%s\n' "${SLUG}"

            STATUS="PASS"
            REASON="-"
            VERSION="unknown"
            DEPENDENCIES=()

            # Start every plugin with an empty log so that anything found in it belongs to this plugin.
            rm -f wp-content/debug.log

            # Step 1: download the plugin. A download failure is recorded as skipped rather than failed,
            # since it generally means a network flake or a plugin that is no longer in the directory.
            if ! install_plugin "${SLUG}"; then
              record "${SLUG}" "unknown" "SKIPPED" "-" "The plugin could not be downloaded from WordPress.org"
              cleanup_plugins
              printf '::endgroup::\n'
              continue
            fi

            VERSION="$( wp plugin get "${SLUG}" --field=version --skip-plugins --skip-themes 2>/dev/null || printf 'unknown' )"

            # Step 2: install whatever the plugin names in `Requires Plugins`. Core refuses to activate a
            # plugin whose dependencies are missing, so without this every WooCommerce extension - a large
            # slice of the most popular plugins - would go untested.
            #
            # Dependencies are resolved a level at a time so that a dependency declaring its own is
            # installed too. Anything already installed is left alone, which covers a plugin named twice
            # in the same tree as well as a declaration pointing back at the plugin under test.
            mapfile -t PENDING < <( plugin_dependencies "${SLUG}" )
            DEPTH=0

            while [ "${#PENDING[@]}" -gt 0 ] && [ "${DEPTH}" -lt "${MAX_DEPENDENCY_DEPTH}" ]; do
              NEXT=()

              for DEPENDENCY in "${PENDING[@]}"; do
                if wp plugin is-installed "${DEPENDENCY}" --skip-plugins --skip-themes > /dev/null 2>&1; then
                  continue
                fi

                printf 'Installing %s, which %s requires.\n' "${DEPENDENCY}" "${SLUG}"

                if ! install_plugin "${DEPENDENCY}"; then
                  STATUS="SKIPPED"
                  REASON="The required plugin ${DEPENDENCY} is not available from WordPress.org"
                  break 2
                fi

                DEPENDENCIES+=( "${DEPENDENCY}" )
                mapfile -t -O "${#NEXT[@]}" NEXT < <( plugin_dependencies "${DEPENDENCY}" )
              done

              PENDING=( "${NEXT[@]}" )
              DEPTH=$(( DEPTH + 1 ))
            done

            # Step 3: activate the dependencies, deepest first. That is the reverse of the order they
            # were discovered in, and it matters because core will not activate a plugin ahead of its own
            # requirements either.
            if [ "${STATUS}" = "PASS" ] && [ "${#DEPENDENCIES[@]}" -gt 0 ]; then
              for (( INDEX = ${#DEPENDENCIES[@]} - 1; INDEX >= 0; INDEX-- )); do
                DEPENDENCY="${DEPENDENCIES[${INDEX}]}"
                DEPENDENCY_EXIT_CODE=0
                DEPENDENCY_OUTPUT="$( wp plugin activate "${DEPENDENCY}" 2>&1 )" || DEPENDENCY_EXIT_CODE=$?
                printf '%s\n' "${DEPENDENCY_OUTPUT}"

                if [ "${DEPENDENCY_EXIT_CODE}" -ne 0 ]; then
                  STATUS="SKIPPED"
                  REASON="The required plugin ${DEPENDENCY} could not be activated"
                  break
                fi
              done
            fi

            # Step 4: with dependencies active the plugin under test is no longer alone on the site, so
            # the baseline is checked before it is activated. A site that is already broken says something
            # about the dependency rather than about the plugin being tested, and blaming the plugin for
            # it would be the masking this workflow is built to avoid.
            if [ "${STATUS}" = "PASS" ] && [ "${#DEPENDENCIES[@]}" -gt 0 ]; then
              for URL_PATH in "/" "/wp-login.php"; do
                BASELINE_REASON="$( check_url "${URL_PATH}" )"

                if [ -n "${BASELINE_REASON}" ]; then
                  STATUS="SKIPPED"
                  REASON="The required plugins are not healthy on their own: ${BASELINE_REASON}"
                  break
                fi
              done

              # Anything the dependencies logged on their way up is not the responsibility of the plugin
              # under test, so the log starts empty again here.
              rm -f wp-content/debug.log
            fi

            # Step 5: activation. Activation runs the plugin's activation hooks and loads its main file.
            if [ "${STATUS}" = "PASS" ]; then
              ACTIVATE_EXIT_CODE=0
              ACTIVATE_OUTPUT="$( wp plugin activate "${SLUG}" 2>&1 )" || ACTIVATE_EXIT_CODE=$?
              printf '%s\n' "${ACTIVATE_OUTPUT}"

              if [ "${ACTIVATE_EXIT_CODE}" -ne 0 ]; then
                case "${ACTIVATE_OUTPUT}" in
                  # Core refuses to activate a plugin whose declared requirements are not met. Dependencies
                  # are installed above, so what is left here is a plugin asking for a version of PHP or
                  # WordPress this job is not running, or for a dependency that is not on WordPress.org.
                  # That is core working as designed rather than a fatal, so it is recorded as skipped.
                  *"to be installed and activated"* | *"requires PHP version"* | *"requires WordPress version"* )
                    STATUS="SKIPPED"
                    REASON="Core declined to activate the plugin because its declared requirements are not met"
                    ;;
                  * )
                    STATUS="FAIL"
                    REASON="The plugin could not be activated"
                    ;;
                esac
              fi
            fi

            # Step 6: boot all of core plus the active plugin in a CLI context.
            if [ "${STATUS}" = "PASS" ]; then
              EVAL_OUTPUT="$( wp eval 'echo "loaded-ok";' 2>&1 )" || true

              if [ "${EVAL_OUTPUT#*loaded-ok}" = "${EVAL_OUTPUT}" ]; then
                printf '%s\n' "${EVAL_OUTPUT}"

                case "${EVAL_OUTPUT}" in
                  *"Fatal error"* | *"PHP Fatal"* | *"Uncaught"* )
                    STATUS="FAIL"
                    REASON="A fatal error occurred while WP-CLI loaded WordPress with the plugin active"
                    ;;
                  # Some plugins redirect or exit while loading, which stops WP-CLI without anything being
                  # broken. Only a fatal counts as a failure here. Everything else is left to the HTTP and
                  # debug log checks below, which see the same code in a real request.
                  * )
                    printf 'WP-CLI did not finish loading WordPress, but no fatal error was reported.\n'
                    ;;
                esac
              fi
            fi

            # Step 7: request the front page and the login screen through the PHP built-in server.
            if [ "${STATUS}" = "PASS" ]; then
              for URL_PATH in "/" "/wp-login.php"; do
                HTTP_REASON="$( check_url "${URL_PATH}" )"

                if [ -n "${HTTP_REASON}" ]; then
                  STATUS="FAIL"
                  REASON="${HTTP_REASON}"
                  break
                fi
              done
            fi

            # Step 8: a fatal can be logged without changing the HTTP status, for example during a shutdown
            # hook, so the debug log is checked separately.
            if [ "${STATUS}" = "PASS" ] && [ -f wp-content/debug.log ] && grep -q 'PHP Fatal' wp-content/debug.log; then
              grep 'PHP Fatal' wp-content/debug.log
              STATUS="FAIL"
              REASON="A fatal error was logged: $( grep -m 1 'PHP Fatal' wp-content/debug.log | cut -c 1-200 )"
            fi

            # Step 9: record the outcome and put the site back the way it was found.
            DEPENDENCY_LIST="-"

            if [ "${#DEPENDENCIES[@]}" -gt 0 ]; then
              DEPENDENCY_LIST="$( printf '%s, ' "${DEPENDENCIES[@]}" )"
              DEPENDENCY_LIST="${DEPENDENCY_LIST%, }"
            fi

            record "${SLUG}" "${VERSION}" "${STATUS}" "${DEPENDENCY_LIST}" "${REASON}"
            cleanup_plugins

            printf '%s: %s\n' "${SLUG}" "${STATUS}"
            printf '::endgroup::\n'
          done < <( printf '%s' "${PLUGIN_SLUGS}" | jq -r '.[]' )

          PASS_COUNT="$( awk -F '\t' '$3 == "PASS" { count++ } END { print count + 0 }' "${RESULTS}" )"
          FAIL_COUNT="$( awk -F '\t' '$3 == "FAIL" { count++ } END { print count + 0 }' "${RESULTS}" )"
          SKIP_COUNT="$( awk -F '\t' '$3 == "SKIPPED" { count++ } END { print count + 0 }' "${RESULTS}" )"

          {
            printf '### WordPress %s / PHP %s\n\n' "${WP_VERSION}" "${PHP_VERSION}"
            printf '%s passed, %s failed, %s skipped.\n\n' "${PASS_COUNT}" "${FAIL_COUNT}" "${SKIP_COUNT}"
            printf '| Plugin | Version | Result | Also active | Details |\n'
            printf '| --- | --- | --- | --- | --- |\n'

            while IFS=$'\t' read -r ROW_SLUG ROW_VERSION ROW_STATUS ROW_DEPENDENCIES ROW_REASON; do
              case "${ROW_STATUS}" in
                PASS ) ICON=':white_check_mark:' ;;
                FAIL ) ICON=':x:' ;;
                * ) ICON=':warning:' ;;
              esac

              printf '| [%s](https://wordpress.org/plugins/%s/) | %s | %s %s | %s | %s |\n' \
                "${ROW_SLUG}" "${ROW_SLUG}" "${ROW_VERSION}" "${ICON}" "${ROW_STATUS}" "${ROW_DEPENDENCIES}" "${ROW_REASON}"
            done < "${RESULTS}"

            printf '\n'
          } >> "${GITHUB_STEP_SUMMARY}"

          # Plugins that could not be downloaded are reported but do not fail the run.
          if [ "${FAIL_COUNT}" -gt 0 ]; then
            printf 'The following plugins failed against WordPress %s:\n' "${WP_VERSION}"
            awk -F '\t' '$3 == "FAIL" { print "- " $1 " (" $2 "): " $5 }' "${RESULTS}"
            exit 1
          fi

          printf 'No plugins fataled against WordPress %s.\n' "${WP_VERSION}"

      - name: Show the web server log
        if: ${{ failure() }}
        run: cat "${RUNNER_TEMP}/php-server.log"
