name: Coding Standards

on:
  # JSHint was introduced in WordPress 3.8.
  # PHPCS checking was introduced in WordPress 5.1.
  push:
    branches:
      - trunk
      - '3.[89]'
      - '[4-9].[0-9]'
  pull_request:
    branches:
      - trunk
      - '3.[89]'
      - '[4-9].[0-9]'
    paths:
      - '**'
      # Documentation, repository metadata, and local environment configuration.
      - '!**.md'
      - '!.devcontainer/**'
      - '!.editorconfig'
      - '!.env.example'
      - '!.git-blame-ignore-revs'
      - '!.gitignore'
      - '!.mailmap'
      - '!docker-compose.yml'
      - '!jsdoc.conf.json'
      - '!tsconfig.json'
      - '!typings/**'
      - '!wp-cli.yml'
      # File types that PHPCS and JSHint do not inspect.
      - '!**.crt'
      - '!**.css'
      - '!**.dat'
      - '!**.dist'
      - '!**.html'
      - '!**.jpg'
      - '!**.json'
      - '!**.map'
      - '!**.mo'
      - '!**.neon'
      - '!**.pem'
      - '!**.png'
      - '!**.po'
      - '!**.scss'
      - '!**.svg'
      - '!**.txt'
      - '!**.webp'
      - '!**.woff2'
      - '!**.xml'
      - '!**.yaml'
      - '!**.yml'
      # JavaScript outside the JSHint targets and all tooling are not inspected.
      - '!tests/e2e/**.js'
      - '!tests/performance/**.js'
      - '!tools/**'
      - '!.eslintrc-jsdoc.js'
      - '!.prettierrc.js'
      - '!eslint.config.js'
      - '!webpack.config.js'
      # Other workflows do not affect these checks.
      - '!.github/**'
      # Re-include configuration and workflow files that affect these checks.
      - 'package*.json'
      - '.npmrc'
      - '.nvmrc'
      - 'Gruntfile.js'
      - 'composer.*'
      - '**.jshintrc'
      - 'phpcs.xml.dist'
      - '.github/workflows/coding-standards.yml'
      - '.github/workflows/reusable-coding-standards-*.yml'
  workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Runs the PHP coding standards checks.
  phpcs:
    name: Coding standards
    uses: ./.github/workflows/reusable-coding-standards-php.yml
    permissions:
      contents: read
    if: |
      github.repository == 'WordPress/wordpress-develop' || (
        github.event_name == 'pull_request' && (
          ! github.event.repository.private ||
          ! github.event.pull_request.draft ||
          contains( github.event.pull_request.labels.*.name, 'Draft Workflow Runs' )
        )
      )

  # Runs the JavaScript coding standards checks.
  jshint:
    name: Coding standards
    uses: ./.github/workflows/reusable-coding-standards-javascript.yml
    permissions:
      contents: read
    if: |
      github.repository == 'WordPress/wordpress-develop' || (
        github.event_name == 'pull_request' && (
          ! github.event.repository.private ||
          ! github.event.pull_request.draft ||
          contains( github.event.pull_request.labels.*.name, 'Draft Workflow Runs' )
        )
      )

  slack-notifications:
    name: Slack Notifications
    uses: ./.github/workflows/slack-notifications.yml
    permissions:
      actions: read
      contents: read
    needs: [ phpcs, jshint ]
    if: ${{ github.repository == 'WordPress/wordpress-develop' && github.event_name != 'pull_request' && always() }}
    with:
      calling_status: ${{ contains( needs.*.result, 'cancelled' ) && 'cancelled' || contains( needs.*.result, 'failure' ) && 'failure' || 'success' }}
    secrets:
      SLACK_GHA_SUCCESS_WEBHOOK: ${{ secrets.SLACK_GHA_SUCCESS_WEBHOOK }}
      SLACK_GHA_CANCELLED_WEBHOOK: ${{ secrets.SLACK_GHA_CANCELLED_WEBHOOK }}
      SLACK_GHA_FIXED_WEBHOOK: ${{ secrets.SLACK_GHA_FIXED_WEBHOOK }}
      SLACK_GHA_FAILURE_WEBHOOK: ${{ secrets.SLACK_GHA_FAILURE_WEBHOOK }}

  failed-workflow:
    name: Failed workflow tasks
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    needs: [ phpcs, jshint, slack-notifications ]
    if: |
      always() &&
      github.repository == 'WordPress/wordpress-develop' &&
      github.event_name != 'pull_request' &&
      github.run_attempt < 2 &&
      (
        contains( needs.*.result, 'cancelled' ) ||
        contains( needs.*.result, 'failure' )
      )

    steps:
      - name: Dispatch workflow run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 2
          retry-exempt-status-codes: 418
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'failed-workflow.yml',
              ref: 'trunk',
              inputs: {
                run_id: `${context.runId}`,
              }
            });
