name: Code Reference Playground Preview Lifecycle

on: # zizmor: ignore[dangerous-triggers] Both jobs check out and run only trusted default-branch code.
    pull_request_target:
        branches:
            - trunk
        types:
            - synchronize
            - closed

permissions: {}

jobs:
    stale:
        name: Mark Code Reference preview stale
        if: >-
            github.event.action == 'synchronize' &&
            ( github.repository == 'WordPress/wordpress-develop' ||
              ( github.repository == 'sirreal/wordpress-develop' && vars.DOCS_PREVIEW_STAGING == 'true' ) )
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        concurrency:
            group: docs-preview-stale-pr-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        permissions:
            actions: read
            contents: read
            pull-requests: write
        steps:
            - name: Check out trusted default-branch lifecycle code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

            - name: Set up the pinned Node version
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '20.20.2'

            - name: Mark the published preview stale
              env:
                  DOCS_PREVIEW_STAGING: ${{ vars.DOCS_PREVIEW_STAGING }}
                  GITHUB_TOKEN: ${{ github.token }}
              run: node .github/scripts/docs-playground-preview/lifecycle.mjs

    quiesce-build:
        name: Stop the obsolete Code Reference build
        if: >-
            github.event.action == 'closed' &&
            ( github.repository == 'WordPress/wordpress-develop' ||
              ( github.repository == 'sirreal/wordpress-develop' && vars.DOCS_PREVIEW_STAGING == 'true' ) )
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        concurrency:
            group: docs-preview-build-pr-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        steps:
            - name: Wait for build cancellation
              run: ':'

    cleanup:
        name: Expire Code Reference preview
        needs: quiesce-build
        if: >-
            github.event.action == 'closed' &&
            ( github.repository == 'WordPress/wordpress-develop' ||
              ( github.repository == 'sirreal/wordpress-develop' && vars.DOCS_PREVIEW_STAGING == 'true' ) )
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        concurrency:
            group: docs-preview-publish-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}
            queue: max
        permissions:
            actions: write
            contents: write
            pull-requests: write
        steps:
            - name: Check out trusted default-branch lifecycle code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

            - name: Set up the pinned Node version
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '20.20.2'

            - name: Delete the pull request preview and caches
              env:
                  DOCS_PREVIEW_STAGING: ${{ vars.DOCS_PREVIEW_STAGING }}
                  GITHUB_TOKEN: ${{ github.token }}
              run: node .github/scripts/docs-playground-preview/lifecycle.mjs
