name: Docs Playground Preview Build

on:
  pull_request:
    branches:
      - trunk
      - '[4-9].[0-9]'
    types: [ 'opened', 'synchronize', 'reopened', 'ready_for_review' ]

# Cancels previous docs preview builds for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  build-docs-playground-preview:
    name: Build docs Playground snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    if: ${{ github.repository == 'WordPress/wordpress-develop' && ! github.event.pull_request.draft }}

    steps:
      - name: Checkout trusted preview harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: harness
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Checkout pull request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-source
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: harness/.github/docs-playground-preview/package-lock.json

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.4'
          tools: composer

      - name: Install preview tooling
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix harness/.github/docs-playground-preview

      - name: Build snapshot
        run: |
          node harness/.github/scripts/docs-playground-preview/build.mjs \
            --wp "$GITHUB_WORKSPACE/pr-source" \
            --out "$GITHUB_WORKSPACE/build" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}"

      - name: Upload docs preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: docs-playground-preview-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            build/docs-playground-snapshot.zip
            build/docs-preview-manifest.json
          if-no-files-found: warn
          retention-days: 2
