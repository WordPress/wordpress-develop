##
# Performs follow-up tasks when a workflow fails or is cancelled.
##
name: Failed Workflow

# `workflow_run` workflows run on the default branch with the secrets and token
# permissions from the default branch of the target repo, not from the branch or
# fork of the workflow run that triggered the event.
#
# The `workflow_run` trigger is safe in this context because:
#
# - Pull request events are excluded by the job-level `if` condition, preventing
#   fork-based privilege escalation.
# - Permissions are tightly constrained (`permissions: {}`), with only `actions: write`
#   granted at the job level.
# - No artifacts are consumed and no user-controlled data is interpolated into
#   the script. Only workflow run metadata (run_attempt, conclusion, id) is read.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - "Code Coverage Report"
      - "Coding Standards"
      - "End-to-end Tests"
      - "Installation Tests"
      - "JavaScript Tests"
      - "JavaScript Type Checking"
      - "Lint GitHub Actions workflow files"
      - "Local Docker Environment"
      - "Performance Tests"
      - "PHP Compatibility"
      - "PHPStan Static Analysis"
      - "PHPUnit Tests"
      - "Test Build Processes"
      - "Test Default Themes & Create ZIPs"
      - "Upgrade Develop Version Tests"
      - "Upgrade Tests"
    types:
      - completed

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Attempts to rerun a workflow.
  #
  # Performs the following steps:
  # - Restarts all failed jobs when the workflow fails or is cancelled for the first time.
  failed-workflow:
    name: Rerun a workflow
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    timeout-minutes: 30
    if: |
      github.repository == 'WordPress/wordpress-develop' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.run_attempt < 2 &&
      (
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'cancelled'
      )

    steps:
      - name: Rerun a workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          retries: 15
          retry-exempt-status-codes: 418
          script: |
            const rerun = await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              enable_debug_logging: true
            });
