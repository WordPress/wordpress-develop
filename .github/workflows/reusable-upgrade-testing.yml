# A reusable workflow that runs WordPress upgrade testing under the conditions provided.
name: Upgrade Tests

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to run tests on.'
        required: false
        type: 'string'
        default: 'ubuntu-24.04'
      wp:
        description: 'The version of WordPress to start with.'
        required: true
        type: 'string'
      new-version:
        description: 'The version of WordPress to update to. Use "latest" to update to the latest version, "develop" to update to the current branch, or provide a specific version number to update to.'
        type: 'string'
        default: 'latest'
      php:
        description: 'The version of PHP to use. Expected format: X.Y.'
        required: true
        type: 'string'
      multisite:
        description: 'Whether to run tests as multisite.'
        required: false
        type: 'boolean'
        default: false
      db-type:
        description: 'Database type. Valid types are mysql and mariadb.'
        required: false
        type: 'string'
        default: 'mysql'
      db-version:
        description: 'Database version.'
        required: false
        type: 'string'
        default: '5.7'

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Runs upgrade tests on a build of WordPress.
  #
  # Performs the following steps:
  # - Sets up PHP.
  # - Downloads the specified version of WordPress.
  # - Creates a `wp-config.php` file.
  # - Installs WordPress.
  # - Checks the version of WordPress before the upgrade.
  # - Updates to the latest minor version.
  # - Updates the database after the minor update.
  # - Checks the version of WordPress after the minor update.
  # - Updates to the version of WordPress being tested.
  # - Updates the database.
  # - Checks the version of WordPress after the upgrade.
  # - Serves the upgraded site and confirms it renders.
  upgrade-tests:
    name: PHP ${{ inputs.php }} with ${{ 'mariadb' == inputs.db-type && 'MariaDB' || 'MySQL' }} ${{ inputs.db-version }}${{ inputs.multisite && ' multisite' || '' }}
    permissions:
      contents: read
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20

    env:
      WP_ADMIN_USER: admin
      WP_ADMIN_PASSWORD: password

    services:
      database:
        image: ${{ inputs.db-type }}:${{ inputs.db-version }}
        ports:
          - 3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval="30s"
          --health-timeout="10s"
          --health-retries="5"
          -e MYSQL_ROOT_PASSWORD="root"
          -e MYSQL_DATABASE="test_db"

    steps:
      - name: Set up PHP ${{ inputs.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '${{ inputs.php }}'
          coverage: none
          tools: wp-cli

      - name: Download WordPress ${{ inputs.wp }}
        run: wp core download --version="${WP_VERSION}"
        env:
          WP_VERSION: ${{ inputs.wp }}

      - name: Create wp-config.php file
        run: wp config create --dbname=test_db --dbuser=root --dbpass=root --dbhost="127.0.0.1:${DB_PORT}"
        env:
          DB_PORT: ${{ job.services.database.ports['3306'] }}

      - name: Install WordPress
        run: |
          wp core ${{ inputs.multisite && 'multisite-install' || 'install' }} \
          --url=http://localhost/ --title="Upgrade Test" --admin_user="${WP_ADMIN_USER}" \
          --admin_password="${WP_ADMIN_PASSWORD}" --admin_email=me@example.org --skip-email

      - name: Pre-upgrade version check
        run: wp core version

      - name: Update to the latest minor version
        run: wp core update --minor

      - name: Update the database after the minor update
        run: wp core update-db ${{ inputs.multisite && '--network' || '' }}

      - name: Post-upgrade version check after the minor update
        run: wp core version

      - name: Download build artifact for the current branch
        if: ${{ inputs.new-version == 'develop' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wordpress-develop

      - name: Upgrade to WordPress at current branch
        if: ${{ inputs.new-version == 'develop' }}
        run: |
          wp core update develop.zip

      - name: Upgrade to WordPress ${{ inputs.new-version }}
        if: ${{ inputs.new-version != 'develop' }}
        run: |
          wp core update ${{ 'latest' != inputs.new-version && '--version="${WP_VERSION}"' || '' }}
        env:
          WP_VERSION: ${{ inputs.new-version }}

      - name: Update the database
        run: wp core update-db ${{ inputs.multisite && '--network' || '' }}

      - name: Post-upgrade version check
        run: wp core version

      - name: Post-upgrade smoke check
        # A network keeps its domain in wp-config.php and the database, not just an option.
        if: ${{ ! inputs.multisite }}
        run: |
          site_url="http://127.0.0.1:${SITE_PORT}"
          fpm_conf="${RUNNER_TEMP}/php-fpm.conf"
          fpm_log="${RUNNER_TEMP}/php-fpm.log"
          fpm_sock="${RUNNER_TEMP}/php-fpm.sock"
          nginx_conf="${RUNNER_TEMP}/nginx.conf"
          nginx_log="${RUNNER_TEMP}/nginx.log"
          jar="${RUNNER_TEMP}/cookies.txt"
          response="${RUNNER_TEMP}/response.txt"
          code="${RUNNER_TEMP}/http-code.txt"
          http_code=''

          # Moving the site and turning off cron are not undone, so this step has to stay last.
          wp option update home "${site_url}"
          wp option update siteurl "${site_url}"
          # A cron spawn and the update checks both make requests the checks did not ask for,
          # and the update checks leave the runner for api.wordpress.org.
          wp config set DISABLE_WP_CRON true --raw
          wp config set WP_HTTP_BLOCK_EXTERNAL true --raw

          # The pool is the step's own. The packaged one runs as www-data and needs root.
          cat > "${fpm_conf}" <<CONF
          [global]
          error_log = ${fpm_log}
          [www]
          listen = ${fpm_sock}
          pm = static
          pm.max_children = 5
          catch_workers_output = yes
          php_admin_flag[log_errors] = On
          php_admin_value[error_log] = ${fpm_log}
          ; The runner turns the JIT on, which stock PHP does not. It crashes the worker on
          ; about five percent of cold pools, so the check runs what a site runs instead.
          php_admin_value[opcache.jit] = disable
          CONF

          cat > "${nginx_conf}" <<CONF
          daemon off;
          pid ${RUNNER_TEMP}/nginx.pid;
          events {}
          http {
            access_log off;
            client_body_temp_path ${RUNNER_TEMP}/nginx-body;
            fastcgi_temp_path ${RUNNER_TEMP}/nginx-fastcgi;
            proxy_temp_path ${RUNNER_TEMP}/nginx-proxy;
            scgi_temp_path ${RUNNER_TEMP}/nginx-scgi;
            uwsgi_temp_path ${RUNNER_TEMP}/nginx-uwsgi;
            server {
              listen 127.0.0.1:${SITE_PORT};
              root ${PWD};
              index index.php;
              location / {
                try_files \$uri \$uri/ /index.php?\$args;
              }
              location ~ \.php\$ {
                include /etc/nginx/fastcgi.conf;
                fastcgi_pass unix:${fpm_sock};
              }
            }
          }
          CONF

          fpm_pid=''
          nginx_pid=''

          stop_server() {
            local status=$?
            kill "${nginx_pid}" "${fpm_pid}" 2> /dev/null || true
            wait "${nginx_pid}" "${fpm_pid}" 2> /dev/null || true
            [ "${status}" -eq 0 ] || tail -n +1 "${nginx_log}" "${fpm_log}" || true
            exit "${status}"
          }
          trap stop_server EXIT

          # setup-php registers the unversioned name only when it installs PHP itself, and it
          # installs nothing when the runner image already carries the version being tested.
          command -v "php-fpm${PHP_VERSION}" > /dev/null \
            || { echo "::error::php-fpm${PHP_VERSION} is not on PATH"; exit 1; }
          "php-fpm${PHP_VERSION}" --nodaemonize --fpm-config "${fpm_conf}" &
          fpm_pid=$!
          nginx -c "${nginx_conf}" -e "${nginx_log}" &
          nginx_pid=$!

          # nginx answers a request before the pool is listening, and that answer is a 502.
          # Neither that nor an unanswered request is a result a check can read.
          deadline=$(( SECONDS + 30 ))
          while :; do
            # A poll that cannot connect prints 000 and exits 7, which would end the step here.
            ready_code="$(curl --silent --max-time 5 --output /dev/null --write-out '%{http_code}' "${site_url}/" || true)"
            [ "${ready_code}" = '000' ] || [ "${ready_code}" = '502' ] || break
            [ "${SECONDS}" -lt "${deadline}" ] \
              || { echo "::error::the site did not come up, and the last status was ${ready_code}"; exit 1; }
            sleep 1
          done

          # Prints what came back and fails the step.
          fail() {
            echo "::error::${1}"
            tail -n 20 "${response}"
            exit 1
          }

          # Requests a path, leaving the body in ${response} and the status in ${http_code}. An
          # HTTP error is a result and comes back to the caller. No reply at all is not. nginx
          # answers a request even when PHP cannot, so no reply means nginx itself stopped.
          fetch() {
            local path="${1}" status=0
            shift
            : > "${response}"
            curl --silent --show-error --max-time 30 --output "${response}" \
              --write-out '%{http_code}' --cookie "${jar}" --cookie-jar "${jar}" \
              "$@" "${site_url}${path}" > "${code}" || status=$?
            http_code="$(cat "${code}")"
            [ "${status}" -eq 0 ] || [ "${status}" -eq 22 ] \
              || fail "${path} got no reply and curl exited ${status}"
            return "${status}"
          }

          # Fails the step unless the response arrives whole and contains every given string.
          check() {
            local path="${1}" marker status=0
            shift
            fetch "${path}" --fail-with-body || status=$?
            [ "${status}" -eq 0 ] || fail "${path} returned HTTP ${http_code}"
            for marker in "$@"; do
              grep -qF -e "${marker}" "${response}" || fail "${path} did not contain: ${marker}"
            done
            echo "ok  ${path}"
          }

          version="$(wp core version)"

          # A fatal after the first bytes leaves a 200 holding half a page, so every check also
          # asks for the end of the document. Unlike an error string, that cannot be reworded.
          check '/' "content=\"WordPress ${version}\"" '</html>'
          check '/?p=1' 'Hello world!' '</html>'

          fetch '/?rest_route=/' --fail-with-body || fail "/?rest_route=/ returned HTTP ${http_code}"
          jq -e '.name == "Upgrade Test"' "${response}" > /dev/null \
            || fail 'the REST index was not the expected JSON'
          echo 'ok  /?rest_route=/'

          # The page prints this for a database that needs no upgrade and for one that holds no
          # install at all. The checks above have already ruled the second one out.
          check '/wp-admin/upgrade.php' 'No Update Required' '</html>'
          check '/wp-login.php' 'id="loginform"' '</html>'

          fetch '/?p=99999999' || true
          [ "${http_code}" = '404' ] || fail "a missing post returned ${http_code}, expected 404"
          grep -qF '</html>' "${response}" || fail 'the 404 page was cut short'
          echo 'ok  404 handling'

          login_status=0
          fetch '/wp-login.php' --fail-with-body \
            --data-urlencode "log=${WP_ADMIN_USER}" --data-urlencode "pwd=${WP_ADMIN_PASSWORD}" || login_status=$?
          [ "${login_status}" -eq 0 ] || fail "logging in returned HTTP ${http_code}"
          grep -qF 'wordpress_logged_in_' "${jar}" || fail 'logging in did not set an authentication cookie'
          echo 'ok  login'

          # The admin bar only renders for a logged-in user, and /wp-admin/ redirects when logged out.
          check '/wp-admin/' 'id="wpadminbar"' '</html>'

          # A fatal that lands after the markers, or during shutdown, still leaves a broken site.
          # The pool always writes a start line, so an empty log means the check reads nothing.
          [ -s "${fpm_log}" ] || { echo '::error::the server wrote no log'; exit 1; }
          if grep -qE 'Fatal error|Uncaught|Segmentation fault|exited on signal' "${fpm_log}"; then
            echo '::error::the server logged a fatal error'
            exit 1
          fi
          echo 'ok  server log'
        env:
          PHP_VERSION: ${{ inputs.php }}
          SITE_PORT: 8889
