# A reusable workflow that runs WordPress upgrade testing under the conditions provided.
name: Upgrade Tests

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to run tests on.'
        required: false
        type: 'string'
        default: 'ubuntu-24.04'
      wp:
        description: 'The version of WordPress to start with.'
        required: true
        type: 'string'
      new-version:
        description: 'The version of WordPress to update to. Use "latest" to update to the latest version, "develop" to update to the current branch, or provide a specific version number to update to.'
        type: 'string'
        default: 'latest'
      php:
        description: 'The version of PHP to use. Expected format: X.Y.'
        required: true
        type: 'string'
      multisite:
        description: 'Whether to run tests as multisite.'
        required: false
        type: 'boolean'
        default: false
      db-type:
        description: 'Database type. Valid types are mysql and mariadb.'
        required: false
        type: 'string'
        default: 'mysql'
      db-version:
        description: 'Database version.'
        required: false
        type: 'string'
        default: '5.7'

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Runs upgrade tests on a build of WordPress.
  #
  # Performs the following steps:
  # - Sets up PHP.
  # - Downloads the specified version of WordPress.
  # - Creates a `wp-config.php` file.
  # - Installs WordPress.
  # - Checks the version of WordPress before the upgrade.
  # - Updates to the latest minor version.
  # - Updates the database after the minor update.
  # - Checks the version of WordPress after the minor update.
  # - Updates to the version of WordPress being tested.
  # - Updates the database.
  # - Checks the version of WordPress after the upgrade.
  # - Serves the upgraded site and confirms it renders.
  upgrade-tests:
    name: PHP ${{ inputs.php }} with ${{ 'mariadb' == inputs.db-type && 'MariaDB' || 'MySQL' }} ${{ inputs.db-version }}${{ inputs.multisite && ' multisite' || '' }}
    permissions:
      contents: read
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20

    env:
      WP_ADMIN_USER: admin
      WP_ADMIN_PASSWORD: password

    services:
      database:
        image: ${{ inputs.db-type }}:${{ inputs.db-version }}
        ports:
          - 3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval="30s"
          --health-timeout="10s"
          --health-retries="5"
          -e MYSQL_ROOT_PASSWORD="root"
          -e MYSQL_DATABASE="test_db"

    steps:
      - name: Set up PHP ${{ inputs.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '${{ inputs.php }}'
          coverage: none
          tools: wp-cli

      - name: Download WordPress ${{ inputs.wp }}
        run: wp core download --version="${WP_VERSION}"
        env:
          WP_VERSION: ${{ inputs.wp }}

      - name: Create wp-config.php file
        run: wp config create --dbname=test_db --dbuser=root --dbpass=root --dbhost="127.0.0.1:${DB_PORT}"
        env:
          DB_PORT: ${{ job.services.database.ports['3306'] }}

      - name: Install WordPress
        run: |
          wp core ${{ inputs.multisite && 'multisite-install' || 'install' }} \
          --url=http://localhost/ --title="Upgrade Test" --admin_user="${WP_ADMIN_USER}" \
          --admin_password="${WP_ADMIN_PASSWORD}" --admin_email=me@example.org --skip-email

      - name: Pre-upgrade version check
        run: wp core version

      - name: Update to the latest minor version
        run: wp core update --minor

      - name: Update the database after the minor update
        run: wp core update-db ${{ inputs.multisite && '--network' || '' }}

      - name: Post-upgrade version check after the minor update
        run: wp core version

      - name: Download build artifact for the current branch
        if: ${{ inputs.new-version == 'develop' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wordpress-develop

      - name: Upgrade to WordPress at current branch
        if: ${{ inputs.new-version == 'develop' }}
        run: |
          wp core update develop.zip

      - name: Upgrade to WordPress ${{ inputs.new-version }}
        if: ${{ inputs.new-version != 'develop' }}
        run: |
          wp core update ${{ 'latest' != inputs.new-version && '--version="${WP_VERSION}"' || '' }}
        env:
          WP_VERSION: ${{ inputs.new-version }}

      - name: Update the database
        run: wp core update-db ${{ inputs.multisite && '--network' || '' }}

      - name: Post-upgrade version check
        run: wp core version

      - name: Post-upgrade smoke check
        # A network keeps its domain in wp-config.php and the database, not just an option.
        if: ${{ ! inputs.multisite }}
        run: |
          site_url="http://127.0.0.1:${SITE_PORT}"
          server_log="${RUNNER_TEMP}/wp-server.log"
          jar="${RUNNER_TEMP}/cookies.txt"
          response="${RUNNER_TEMP}/response.txt"
          code="${RUNNER_TEMP}/http-code.txt"

          # Moving the site and turning off cron are not undone, so this step has to stay last.
          wp option update home "${site_url}"
          wp option update siteurl "${site_url}"
          # Cron spawns a request back to this server, which then has nothing left to serve it.
          wp config set DISABLE_WP_CRON true --raw

          wp server --host=127.0.0.1 --port="${SITE_PORT}" > "${server_log}" 2>&1 &
          server_pid=$!

          stop_server() {
            local status=$?
            pkill -P "${server_pid}" || true
            kill "${server_pid}" 2> /dev/null || true
            [ "${status}" -eq 0 ] || cat "${server_log}"
            exit "${status}"
          }
          trap stop_server EXIT

          timeout 30 bash -c "until curl --silent --output /dev/null \"${site_url}/\"; do kill -0 ${server_pid} 2> /dev/null || exit 1; sleep 1; done"

          # Prints what came back and fails the step.
          fail() {
            echo "::error::${1}"
            head -n 20 "${response}"
            exit 1
          }

          # Requests a path, leaving the body in ${response} and the status in ${http_code}. An
          # HTTP error is a result and comes back to the caller. No reply at all is not: the
          # step says whether the server is still up, because that tells the two causes apart.
          fetch() {
            local path="${1}" status=0
            shift
            : > "${response}"
            curl --silent --show-error --max-time 30 --output "${response}" \
              --write-out '%{http_code}' --cookie "${jar}" --cookie-jar "${jar}" \
              "$@" "${site_url}${path}" > "${code}" || status=$?
            http_code="$(cat "${code}")"
            if [ "${status}" -ne 0 ] && [ "${status}" -ne 22 ]; then
              if ! kill -0 "${server_pid}" 2> /dev/null; then
                # 139 here means a signal 11, so the page brought the interpreter down with it.
                server_status=0
                wait "${server_pid}" || server_status=$?
                fail "${path} took the server down, which left ${server_status}"
              fi
              fail "${path} got no reply, curl exited ${status}"
            fi
            return "${status}"
          }

          # Fails the step unless the response arrives whole and contains every given string.
          check() {
            local path="${1}" marker status=0
            shift
            fetch "${path}" --fail-with-body || status=$?
            [ "${status}" -eq 0 ] || fail "${path} returned HTTP ${http_code}"
            for marker in "$@"; do
              grep -qF "${marker}" "${response}" || fail "${path} did not contain: ${marker}"
            done
            echo "ok  ${path}"
          }

          version="$(wp core version)"

          # A fatal after the first bytes leaves a 200 holding half a page, so every check also
          # asks for the end of the document. Unlike an error string, that cannot be reworded.
          check '/' "content=\"WordPress ${version}\"" '</html>'
          check '/?p=1' 'Hello world!' '</html>'

          check '/?rest_route=/' '"name":"Upgrade Test"'
          jq -e . "${response}" > /dev/null || fail 'the REST index was not whole JSON'

          check '/wp-admin/upgrade.php' 'No Update Required' '</html>'
          check '/wp-login.php' 'id="loginform"' '</html>'

          fetch '/?p=99999999'
          [ "${http_code}" = '404' ] || fail "a missing post returned ${http_code}, expected 404"
          echo 'ok  404 handling'

          login_status=0
          fetch '/wp-login.php' --fail-with-body \
            --data-urlencode "log=${WP_ADMIN_USER}" --data-urlencode "pwd=${WP_ADMIN_PASSWORD}" || login_status=$?
          [ "${login_status}" -eq 0 ] || fail "logging in returned HTTP ${http_code}"
          grep -q 'wordpress_logged_in_' "${jar}" || fail 'logging in did not set an authentication cookie'
          echo 'ok  login'

          # The admin bar only renders for a logged-in user, and /wp-admin/ redirects when logged out.
          check '/wp-admin/' 'id="wpadminbar"' '</html>'

          # A fatal that lands after the markers, or during shutdown, still leaves a broken site.
          if grep -qE 'Fatal error|Uncaught|Segmentation fault' "${server_log}"; then
            echo '::error::the server logged a fatal error'
            exit 1
          fi
          echo 'ok  server log'
        env:
          SITE_PORT: 8889
